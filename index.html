<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordly Dictionary</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 class="heading">Wordly Dictionary</h1>
        <input placeholder="Search a word" type="text" class="input" id="input">
        <p class="info-text" id="info-text">Type a word and press Enter</p>
        <div class="meaning-container" id="meaning-container">
            <p>Word: <span class="title" id="title">_______</span></p>
            <p>Meaning: <span class="meaning" id="meaning">_______</span></p>
            <p>Part of Speech: <span class="partOfspeech" id="partOfspeech">_______</span></p>
            <p>Example: <span class="example" id="example">_______</span></p>
            <p>Synonym: <span class="synonym" id="synonym">_______</span></p>
            <audio src="" controls id="audio"></audio>  
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
